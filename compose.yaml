services:
  app:
    build:
      context: .
      target: runner
    env_file: .env.local
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
  migrate:
    profiles: [tools]
    build:
      context: .
      target: tools
    env_file: .env.local
    environment:
      NODE_ENV: production
    command: [npm, run, db:deploy]
