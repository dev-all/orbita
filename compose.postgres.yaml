# Base local opcional. No se levanta con compose.yaml.
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: orbita_dev
      POSTGRES_USER: orbita_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí una contraseña local antes de iniciar PostgreSQL}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - orbita_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U orbita_dev -d orbita_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  orbita_pgdata:
